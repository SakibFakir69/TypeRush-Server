name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-
      # FIX LINT ISSUE
      - name: Lint FIX
        run: npm run lint:fix

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

        